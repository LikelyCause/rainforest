name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAINFOREST_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      RAINFOREST_TEST_MONGO_URL: mongodb://localhost:27017
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: sudo apt-get install -y --no-install-recommends libgomp1
      - run: pip install -r requirements-dev.txt
      - name: Start an MLflow tracking server
        run: |
          docker run -d --name mlflow -p 5000:5000 ghcr.io/mlflow/mlflow:v3.17.0 mlflow server \
            --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////tmp/mlflow.db \
            --serve-artifacts --artifacts-destination /tmp/mlartifacts --static-prefix /mlflow
          for i in $(seq 60); do curl -fs http://localhost:5000/mlflow/health && exit 0; sleep 2; done
          docker logs mlflow; exit 1
      - run: pytest -q -rs
        env:
          MLFLOW_TEST_URI: http://localhost:5000/mlflow
      - name: MLflow sidecar tests
        run: pytest -q
        working-directory: mlflow

  ui:
    name: UI typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: nginx config rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext-base
          bash nginx/test.sh

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (the version in requirements-dev.txt)
        run: pip install "$(grep '^ruff==' api/requirements-dev.txt)"
      - name: Ruff
        working-directory: api
        run: ruff check --output-format github .
      - name: Ruff format
        working-directory: api
        run: ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - working-directory: ui
        run: npm ci
      - name: ESLint
        working-directory: ui
        run: npm run lint
      - name: Prettier
        working-directory: ui
        run: npm run format:check

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      # The default values leave `hostname` empty on purpose, so lint with the CI values files.
      - name: helm lint
        run: |
          helm lint deploy/chart/rainforest -f deploy/chart/rainforest/ci/dev-values.yaml
          helm lint deploy/chart/rainforest -f deploy/chart/rainforest/ci/team-values.yaml
      - name: helm-unittest
        run: bash deploy/chart/test.sh
      - name: smoke.sh syntax
        run: bash -n deploy/smoke.sh

  images:
    name: Docker images build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile keycloak build
