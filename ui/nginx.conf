# Keep the scheme a TLS proxy in front of nginx reports, so the API marks its cookie Secure.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Large uploads go straight through to the API (which streams them to disk).
    client_max_body_size 20g;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Upstreams are resolved per request through Docker's DNS, so nginx starts without them and follows a
    # recreated container to its new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://api:8000;
        # No URI part, so the request URI and query string pass through unchanged.
        proxy_pass $api;
        proxy_http_version 1.1;
        # Host with its port: the API compares it with the browser's Origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # MLflow tracking UI, behind the Rainforest session.
    location /mlflow/ {
        auth_request /_auth;
        error_page 401 = @signin;
        set $mlflow http://mlflow:5000;
        proxy_pass $mlflow;
        proxy_http_version 1.1;
        # MLflow only accepts its own host name; cross-site requests never get past auth_request
        # (the session cookie is SameSite=Strict), so its Origin check is not needed here.
        proxy_set_header Host mlflow;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;
    }

    location = /_auth {
        internal;
        set $api http://api:8000;
        proxy_pass $api/api/auth/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Transfer-Encoding "";
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
    }

    location @signin {
        # Relative, so the browser keeps the host port nginx can't see (e.g. 8080 mapped to 80).
        absolute_redirect off;
        return 302 /login?next=/mlflow/;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
