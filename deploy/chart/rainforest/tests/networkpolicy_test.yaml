suite: network policies
release:
  name: rf
  namespace: team
templates:
  - mlflow-networkpolicy.yaml
  - postgresql-networkpolicy.yaml
set:
  hostname: vehicles.example.com
tests:
  - it: lets only the api and ui pods reach the in-chart MLflow, on 5000
    template: mlflow-networkpolicy.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: apiVersion
          value: networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: rf-rainforest-mlflow
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: rainforest
            app.kubernetes.io/instance: rf
            app.kubernetes.io/component: mlflow
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: rainforest
                      app.kubernetes.io/instance: rf
                      app.kubernetes.io/component: api
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: rainforest
                      app.kubernetes.io/instance: rf
                      app.kubernetes.io/component: ui
              ports:
                - protocol: TCP
                  port: 5000

  - it: lets only the api and mlflow pods reach the in-chart Postgres, on 5432
    template: postgresql-networkpolicy.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: rf-rainforest-postgresql
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: rainforest
            app.kubernetes.io/instance: rf
            app.kubernetes.io/component: postgresql
      - equal:
          path: spec.policyTypes
          value: [Ingress]
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: rainforest
                      app.kubernetes.io/instance: rf
                      app.kubernetes.io/component: api
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: rainforest
                      app.kubernetes.io/instance: rf
                      app.kubernetes.io/component: mlflow
              ports:
                - protocol: TCP
                  port: 5432

  - it: lets the api reach Postgres even with MLflow off
    template: postgresql-networkpolicy.yaml
    set:
      mlflow.mode: "off"
    asserts:
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: api

  - it: renders neither policy when networkPolicy.enabled is false
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: mlflow-networkpolicy.yaml
      - hasDocuments:
          count: 0
        template: postgresql-networkpolicy.yaml

  - it: renders no MLflow policy for an external server
    template: mlflow-networkpolicy.yaml
    set:
      mlflow.mode: external
      mlflow.externalUrl: https://mlflow.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no MLflow policy with MLflow off
    template: mlflow-networkpolicy.yaml
    set:
      mlflow.mode: "off"
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Postgres policy for an external server
    template: postgresql-networkpolicy.yaml
    set:
      postgresql.enabled: false
      postgresql.external.host: pg.example.com
    asserts:
      - hasDocuments:
          count: 0
