suite: secret
release:
  name: rf
  namespace: team
templates:
  - secret.yaml
  - api-deployment.yaml
  - configmap.yaml
set:
  hostname: vehicles.example.com
tests:
  - it: creates a Secret from values
    template: secret.yaml
    set:
      auth.mode: oidc
      secrets.values.sessionSecret: s3ss
      secrets.values.oidcClientSecret: oidc-secret
      secrets.values.readonlyPassword: ro-pass
      secrets.values.postgresPassword: pg-pass
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: rf-rainforest
      - equal:
          path: stringData.sessionSecret
          value: s3ss
      - equal:
          path: stringData.oidcClientSecret
          value: oidc-secret
      - equal:
          path: stringData.readonlyPassword
          value: ro-pass
      - equal:
          path: stringData.postgresPassword
          value: pg-pass

  - it: omits an empty session secret so the API generates one
    template: secret.yaml
    asserts:
      - notExists:
          path: stringData.sessionSecret
      - exists:
          path: stringData.postgresPassword
      - exists:
          path: stringData.readonlyPassword

  - it: generates passwords for the in-chart server when none are given
    template: secret.yaml
    asserts:
      - matchRegex:
          path: stringData.postgresPassword
          pattern: '^[A-Za-z0-9]{24}$'
      - matchRegex:
          path: stringData.readonlyPassword
          pattern: '^[A-Za-z0-9]{24}$'

  - it: requires the database password for an external server
    template: secret.yaml
    set:
      postgresql.enabled: false
      postgresql.external.host: pg.example.com
    asserts:
      - failedTemplate:
          errorPattern: postgresPassword

  - it: requires the console password for an external server
    template: secret.yaml
    set:
      postgresql.enabled: false
      postgresql.external.host: pg.example.com
      secrets.values.postgresPassword: pg-pass
    asserts:
      - failedTemplate:
          errorPattern: readonlyPassword

  - it: requires the OIDC client secret under oidc
    template: secret.yaml
    set:
      auth.mode: oidc
    asserts:
      - failedTemplate:
          errorPattern: oidcClientSecret

  - it: carries MLflow credentials when given
    template: secret.yaml
    set:
      mlflow.mode: external
      mlflow.externalUrl: https://mlflow.example.com
      secrets.values.mlflowTrackingUsername: u
      secrets.values.mlflowTrackingPassword: p
      secrets.values.mlflowTrackingToken: t
    asserts:
      - equal:
          path: stringData.mlflowTrackingUsername
          value: u
      - equal:
          path: stringData.mlflowTrackingPassword
          value: p
      - equal:
          path: stringData.mlflowTrackingToken
          value: t

  - it: renders no Secret when existingSecret is set
    template: secret.yaml
    set:
      secrets.existingSecret: team-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: references the existing Secret everywhere
    template: api-deployment.yaml
    set:
      secrets.existingSecret: team-secret
      auth.mode: oidc
      mlflow.mode: external
      mlflow.externalUrl: https://mlflow.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name
          value: team-secret
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="READONLY_PASSWORD")].valueFrom.secretKeyRef.name
          value: team-secret
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RAINFOREST_SESSION_SECRET")].valueFrom.secretKeyRef.name
          value: team-secret
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RAINFOREST_OIDC_CLIENT_SECRET")].valueFrom.secretKeyRef.name
          value: team-secret
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MLFLOW_TRACKING_USERNAME")].valueFrom.secretKeyRef.name
          value: team-secret
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MLFLOW_TRACKING_PASSWORD")].valueFrom.secretKeyRef.name
          value: team-secret
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MLFLOW_TRACKING_TOKEN")].valueFrom.secretKeyRef.name
          value: team-secret

  - it: references the chart's own Secret otherwise
    template: api-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="POSTGRES_PASSWORD")].valueFrom.secretKeyRef.name
          value: rf-rainforest
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="READONLY_PASSWORD")].valueFrom.secretKeyRef.key
          value: readonlyPassword

  - it: marks the session secret optional
    template: api-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RAINFOREST_SESSION_SECRET")].valueFrom.secretKeyRef.optional
          value: true

  - it: references no OIDC secret under pick
    template: api-deployment.yaml
    set:
      auth.mode: pick
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="RAINFOREST_OIDC_CLIENT_SECRET")]

  - it: references the OIDC secret under oidc
    template: api-deployment.yaml
    set:
      auth.mode: oidc
      secrets.values.oidcClientSecret: oidc-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="RAINFOREST_OIDC_CLIENT_SECRET")].valueFrom.secretKeyRef.key
          value: oidcClientSecret

  - it: references no MLflow credentials for the in-chart server
    template: api-deployment.yaml
    set:
      mlflow.mode: in-chart
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="MLFLOW_TRACKING_USERNAME")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="MLFLOW_TRACKING_PASSWORD")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="MLFLOW_TRACKING_TOKEN")]

  - it: references no MLflow credentials when MLflow is off
    template: api-deployment.yaml
    set:
      mlflow.mode: "off"
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="MLFLOW_TRACKING_USERNAME")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="MLFLOW_TRACKING_PASSWORD")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="MLFLOW_TRACKING_TOKEN")]

  - it: references optional MLflow credentials for an external server
    template: api-deployment.yaml
    set:
      mlflow.mode: external
      mlflow.externalUrl: https://mlflow.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MLFLOW_TRACKING_TOKEN")].valueFrom.secretKeyRef.optional
          value: true
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="MLFLOW_TRACKING_USERNAME")].valueFrom.secretKeyRef.key
          value: mlflowTrackingUsername
