suite: postgresql
release:
  name: rf
  namespace: team
templates:
  - postgresql-statefulset.yaml
  - postgresql-service.yaml
  - api-deployment.yaml
  - configmap.yaml
  - secret.yaml
set:
  hostname: vehicles.example.com
  secrets.values.postgresPassword: pg-pass
  secrets.values.readonlyPassword: ro-pass
tests:
  - it: runs one postgres:16-alpine replica as the image's postgres user
    template: postgresql-statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: rf-rainforest-postgresql
      - equal:
          path: spec.serviceName
          value: rf-rainforest-postgresql
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: postgres:16-alpine
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 70
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 70

  - it: renders the four Compose tuning flags as -c arguments, sorted
    template: postgresql-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - postgres
            - -c
            - maintenance_work_mem=256MB
            - -c
            - max_wal_size=4GB
            - -c
            - shared_buffers=512MB
            - -c
            - work_mem=32MB

  - it: merges a custom tuning map over the defaults
    template: postgresql-statefulset.yaml
    set:
      postgresql.tuning:
        shared_buffers: 2GB
        max_connections: 200
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - postgres
            - -c
            - maintenance_work_mem=256MB
            - -c
            - max_connections=200
            - -c
            - max_wal_size=4GB
            - -c
            - shared_buffers=2GB
            - -c
            - work_mem=32MB

  - it: takes the database and user from values and the password from the chart's Secret
    template: postgresql-statefulset.yaml
    set:
      postgresql.database: vehicles
      postgresql.user: vehicle_app
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_DB
            value: vehicles
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_USER
            value: vehicle_app
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rf-rainforest
                key: postgresPassword

  - it: reads the password from existingSecret when one is named
    template: postgresql-statefulset.yaml
    set:
      secrets.existingSecret: my-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: postgresPassword

  - it: asks for a 20Gi volume at the data directory, with no storage class by default
    template: postgresql-statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: data
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes
          value: [ReadWriteOnce]
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 20Gi
      - notExists:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /var/lib/postgresql/data

  - it: sets the storage class and size when given
    template: postgresql-statefulset.yaml
    set:
      postgresql.persistence.size: 100Gi
      postgresql.persistence.storageClass: fast-ssd
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: fast-ssd
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 100Gi

  - it: is ready when pg_isready answers for the configured database and user
    template: postgresql-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"

  - it: passes resources through
    template: postgresql-statefulset.yaml
    set:
      postgresql.resources:
        requests:
          memory: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi

  - it: serves 5432 under the name the API connects to
    template: postgresql-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: rf-rainforest-postgresql
      - equal:
          path: spec.ports[0].port
          value: 5432
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: postgresql

  - it: points the API at the in-chart server
    template: api-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            value: postgresql://rainforest:$(POSTGRES_PASSWORD)@rf-rainforest-postgresql:5432/rainforest
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: POSTGRES_PASSWORD

  - it: manages roles on the in-chart server whatever external.managedRoles says
    template: configmap.yaml
    set:
      postgresql.external.managedRoles: false
    asserts:
      - equal:
          path: data.RAINFOREST_MANAGED_ROLES
          value: "true"

  - it: renders no StatefulSet when postgresql is disabled
    template: postgresql-statefulset.yaml
    set:
      postgresql.enabled: false
      postgresql.external.host: db.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no Service when postgresql is disabled
    template: postgresql-service.yaml
    set:
      postgresql.enabled: false
      postgresql.external.host: db.example.com
    asserts:
      - hasDocuments:
          count: 0

  - it: points the API at the external server
    template: api-deployment.yaml
    set:
      postgresql.enabled: false
      postgresql.external.host: db.example.com
      postgresql.external.port: 6432
      postgresql.external.database: vehicles
      postgresql.external.user: vehicle_app
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            value: postgresql://vehicle_app:$(POSTGRES_PASSWORD)@db.example.com:6432/vehicles

  - it: leaves role management to the ops team when external.managedRoles is false
    template: configmap.yaml
    set:
      postgresql.enabled: false
      postgresql.external.host: db.example.com
      postgresql.external.managedRoles: false
    asserts:
      - equal:
          path: data.RAINFOREST_MANAGED_ROLES
          value: "false"

  - it: requires a host when postgresql is disabled
    template: api-deployment.yaml
    set:
      postgresql.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: postgresql.external.host is required when postgresql.enabled is false
