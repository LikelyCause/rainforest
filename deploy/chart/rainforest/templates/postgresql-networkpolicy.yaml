{{- if and .Values.postgresql.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rainforest.fullname" . }}-postgresql
  labels:
    {{- include "rainforest.labels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rainforest.selectorLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rainforest.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "rainforest.selectorLabels" (dict "root" . "component" "mlflow") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
