{{- if not .Values.secrets.existingSecret }}
{{- $v := .Values.secrets.values }}
{{- /* An earlier install's generated passwords are kept, since the database was initialised with them. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "rainforest.fullname" .) }}
{{- $old := dict }}
{{- if and $existing $existing.data }}{{ $old = $existing.data }}{{ end }}
{{- $postgresPassword := $v.postgresPassword }}
{{- $readonlyPassword := $v.readonlyPassword }}
{{- if .Values.postgresql.enabled }}
{{- $postgresPassword = $postgresPassword | default ((index $old "postgresPassword" | default "") | b64dec) | default (randAlphaNum 24) }}
{{- $readonlyPassword = $readonlyPassword | default ((index $old "readonlyPassword" | default "") | b64dec) | default (randAlphaNum 24) }}
{{- else }}
{{- $postgresPassword = required "secrets.values.postgresPassword is required with an external PostgreSQL server (or set secrets.existingSecret)" $postgresPassword }}
{{- $readonlyPassword = required "secrets.values.readonlyPassword is required with an external PostgreSQL server, and must match the console role's password (or set secrets.existingSecret)" $readonlyPassword }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rainforest.fullname" . }}
  labels:
    {{- include "rainforest.labels" (dict "root" . "component" "api") | nindent 4 }}
type: Opaque
stringData:
  postgresPassword: {{ $postgresPassword | quote }}
  readonlyPassword: {{ $readonlyPassword | quote }}
  {{- if $v.sessionSecret }}
  sessionSecret: {{ $v.sessionSecret | quote }}
  {{- end }}
  {{- if eq .Values.auth.mode "oidc" }}
  oidcClientSecret: {{ required "secrets.values.oidcClientSecret is required with auth.mode oidc (or set secrets.existingSecret)" $v.oidcClientSecret | quote }}
  {{- end }}
  {{- if eq .Values.mlflow.mode "external" }}
  {{- with $v.mlflowTrackingUsername }}
  mlflowTrackingUsername: {{ . | quote }}
  {{- end }}
  {{- with $v.mlflowTrackingPassword }}
  mlflowTrackingPassword: {{ . | quote }}
  {{- end }}
  {{- with $v.mlflowTrackingToken }}
  mlflowTrackingToken: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
