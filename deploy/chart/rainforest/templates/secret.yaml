{{- if not .Values.secrets.existingSecret }}
{{- /* No generated values: a render must be repeatable (helm template, Argo CD), or every sync would rewrite the passwords. */}}
{{- $v := .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rainforest.fullname" . }}
  labels:
    {{- include "rainforest.labels" (dict "root" . "component" "api") | nindent 4 }}
type: Opaque
stringData:
  postgresPassword: {{ required "secrets.values.postgresPassword is required unless secrets.existingSecret names a Secret you manage (recommended for real installs)" $v.postgresPassword | quote }}
  readonlyPassword: {{ required "secrets.values.readonlyPassword is required unless secrets.existingSecret names a Secret you manage (recommended for real installs)" $v.readonlyPassword | quote }}
  {{- if $v.sessionSecret }}
  sessionSecret: {{ $v.sessionSecret | quote }}
  {{- end }}
  {{- if eq .Values.auth.mode "oidc" }}
  oidcClientSecret: {{ required "secrets.values.oidcClientSecret is required with auth.mode oidc unless secrets.existingSecret names a Secret you manage" $v.oidcClientSecret | quote }}
  {{- end }}
  {{- if eq .Values.mlflow.mode "external" }}
  {{- with $v.mlflowTrackingUsername }}
  mlflowTrackingUsername: {{ . | quote }}
  {{- end }}
  {{- with $v.mlflowTrackingPassword }}
  mlflowTrackingPassword: {{ . | quote }}
  {{- end }}
  {{- with $v.mlflowTrackingToken }}
  mlflowTrackingToken: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
