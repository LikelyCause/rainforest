apiVersion: v1
kind: Service
metadata:
  name: {{ include "rainforest.fullname" . }}-api
  labels:
    {{- include "rainforest.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "rainforest.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
