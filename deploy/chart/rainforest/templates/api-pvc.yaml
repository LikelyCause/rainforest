apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rainforest.fullname" . }}-data
  labels:
    {{- include "rainforest.labels" (dict "root" . "component" "api") | nindent 4 }}
  {{- if .Values.persistence.keep }}
  annotations:
    {{- include "rainforest.keepAnnotations" . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.data.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
