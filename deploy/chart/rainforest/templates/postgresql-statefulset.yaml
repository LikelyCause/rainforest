{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rainforest.fullname" . }}-postgresql
  labels:
    {{- include "rainforest.labels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "rainforest.fullname" . }}-postgresql
  selector:
    matchLabels:
      {{- include "rainforest.selectorLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rainforest.selectorLabels" (dict "root" . "component" "postgresql") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # uid 70 is the postgres user in the alpine image.
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        runAsNonRoot: true
      containers:
        - name: postgresql
          image: {{ printf "%s:%s" .Values.postgresql.image.repository .Values.postgresql.image.tag | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args:
            - postgres
            {{- range $key, $value := .Values.postgresql.tuning }}
            - -c
            - {{ printf "%s=%s" $key (include "rainforest.num" $value) }}
            {{- end }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ include "rainforest.databaseName" . | quote }}
            - name: POSTGRES_USER
              value: {{ include "rainforest.databaseUser" . | quote }}
            # Read only when the image initialises an empty volume; see postgresql.enabled in values.yaml.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: postgresPassword
            # A subdirectory, because a fresh volume's root can hold lost+found, which makes initdb refuse to start.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            # Exec probes don't expand $(VAR), so a shell reads the container's environment.
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          {{- with .Values.postgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "rainforest.selectorLabels" (dict "root" . "component" "postgresql") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size | quote }}
{{- end }}
