apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rainforest.fullname" . }}-api
  labels:
    {{- include "rainforest.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: 1
  # One ReadWriteOnce volume: the old pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rainforest.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "rainforest.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: api
          image: {{ include "rainforest.image" (dict "image" .Values.api.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "rainforest.fullname" . }}
          env:
            # libpq reads PGPASSWORD when the URL has no password, so a password with /, # or ? never has to be URL-encoded.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: postgresPassword
            - name: DATABASE_URL
              value: {{ include "rainforest.postgresUri" (dict "root" . "database" (include "rainforest.databaseName" .)) | quote }}
            - name: READONLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: readonlyPassword
            - name: DATA_DIR
              value: /data
            - name: RAINFOREST_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: sessionSecret
                  optional: true
            {{- if eq .Values.auth.mode "oidc" }}
            - name: RAINFOREST_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: oidcClientSecret
            {{- end }}
            {{- if eq .Values.mlflow.mode "external" }}
            - name: MLFLOW_TRACKING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: mlflowTrackingUsername
                  optional: true
            - name: MLFLOW_TRACKING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: mlflowTrackingPassword
                  optional: true
            - name: MLFLOW_TRACKING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: mlflowTrackingToken
                  optional: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "rainforest.fullname" . }}-data
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
