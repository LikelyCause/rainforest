{{- /*
  api.gpu.enabled layers the GPU settings over the plain api.* ones: the CUDA build's tag replaces the CPU one, the
  nvidia.com/gpu limit is added to api.resources.limits, api.gpu.nodeSelector wins over api.nodeSelector on a shared key,
  and api.gpu.tolerations come after api.tolerations.
*/ -}}
{{- $image := merge (dict "tag" (include "rainforest.apiImageTag" .)) .Values.api.image }}
{{- $resources := deepCopy .Values.api.resources }}
{{- $nodeSelector := .Values.api.nodeSelector }}
{{- $tolerations := .Values.api.tolerations }}
{{- if .Values.api.gpu.enabled }}
{{- if lt (int .Values.api.gpu.count) 1 }}
{{- fail (printf "api.gpu.count is %v: the pod must claim at least one GPU" .Values.api.gpu.count) }}
{{- end }}
{{- $limits := default dict $resources.limits }}
{{- $_ := set $limits "nvidia.com/gpu" (int .Values.api.gpu.count) }}
{{- $_ = set $resources "limits" $limits }}
{{- $nodeSelector = merge (deepCopy .Values.api.gpu.nodeSelector) .Values.api.nodeSelector }}
{{- $tolerations = concat .Values.api.tolerations .Values.api.gpu.tolerations }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rainforest.fullname" . }}-api
  labels:
    {{- include "rainforest.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: 1
  # One ReadWriteOnce volume: the old pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rainforest.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "rainforest.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: api
          image: {{ include "rainforest.image" (dict "image" $image "root" .) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "rainforest.fullname" . }}
          env:
            # libpq reads PGPASSWORD when the URL has no password, so a password with /, # or ? never has to be URL-encoded.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: postgresPassword
            - name: DATABASE_URL
              value: {{ include "rainforest.postgresUri" (dict "root" . "database" (include "rainforest.databaseName" .)) | quote }}
            - name: READONLY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: readonlyPassword
            - name: DATA_DIR
              value: /data
            - name: RAINFOREST_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: sessionSecret
                  optional: true
            {{- if .Values.api.gpu.enabled }}
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            {{- end }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: RAINFOREST_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: oidcClientSecret
            {{- end }}
            {{- if eq .Values.mlflow.mode "external" }}
            - name: MLFLOW_TRACKING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: mlflowTrackingUsername
                  optional: true
            - name: MLFLOW_TRACKING_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: mlflowTrackingPassword
                  optional: true
            - name: MLFLOW_TRACKING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: mlflowTrackingToken
                  optional: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          {{- with $resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "rainforest.fullname" . }}-data
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
