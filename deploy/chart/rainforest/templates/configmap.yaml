{{- $fixed := include "rainforest.configData" . | fromYaml }}
{{- $podEnv := include "rainforest.podEnvNames" . | splitList " " }}
{{- range $key, $_ := .Values.api.tuning }}
{{- if or (hasKey $fixed $key) (has $key $podEnv) }}
{{- fail (printf "api.tuning.%s: the chart sets %s itself; use the value that controls it instead" $key $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rainforest.fullname" . }}
  labels:
    {{- include "rainforest.labels" (dict "root" . "component" "api") | nindent 4 }}
data:
  {{- include "rainforest.configData" . | nindent 2 }}
  {{- range $key, $value := .Values.api.tuning }}
  {{ $key }}: {{ include "rainforest.num" $value | quote }}
  {{- end }}
