{{- if eq .Values.mlflow.mode "in-chart" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rainforest.fullname" . }}-mlflow
  labels:
    {{- include "rainforest.labels" (dict "root" . "component" "mlflow") | nindent 4 }}
spec:
  replicas: 1
  # One ReadWriteOnce volume: the old pod must release it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rainforest.selectorLabels" (dict "root" . "component" "mlflow") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rainforest.selectorLabels" (dict "root" . "component" "mlflow") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: mlflow
          image: {{ include "rainforest.image" (dict "image" .Values.mlflow.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.mlflow.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # The image's entrypoint (start.py) creates the database if missing, then runs `mlflow server` with these.
          args:
            - --host
            - 0.0.0.0
            - --port
            - "5000"
            - --workers
            - "2"
            - --serve-artifacts
            - --artifacts-destination
            - /mlartifacts
            - --static-prefix
            - /mlflow
            - --allowed-hosts
            - {{ include "rainforest.mlflowAllowedHosts" . | quote }}
          ports:
            - name: http
              containerPort: 5000
          env:
            # Kubernetes expands $(VAR) from earlier entries, so the password stays out of the manifest.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rainforest.secretName" . }}
                  key: postgresPassword
            - name: MLFLOW_BACKEND_STORE_URI
              value: {{ printf "postgresql://%s:$(POSTGRES_PASSWORD)@%s:%s/%s" (include "rainforest.databaseUser" .) (include "rainforest.databaseHost" .) (include "rainforest.databasePort" .) (include "rainforest.mlflowDatabase" .) | quote }}
            - name: MLFLOW_MANAGED_DATABASE
              value: {{ include "rainforest.managedRoles" . | quote }}
          # /mlflow/health is exempt from MLflow's Host check, so the kubelet's pod-IP Host header is accepted.
          startupProbe:
            httpGet:
              path: /mlflow/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /mlflow/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /mlflow/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          {{- with .Values.mlflow.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: artifacts
              mountPath: /mlartifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ include "rainforest.fullname" . }}-mlflow
      {{- with .Values.mlflow.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mlflow.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
