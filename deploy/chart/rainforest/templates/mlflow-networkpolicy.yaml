{{- if and (eq .Values.mlflow.mode "in-chart") .Values.networkPolicy.enabled }}
# MLflow has no sign-in of its own: the UI's /mlflow/ proxy (behind the Rainforest sign-in) and the API are its clients.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rainforest.fullname" . }}-mlflow
  labels:
    {{- include "rainforest.labels" (dict "root" . "component" "mlflow") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rainforest.selectorLabels" (dict "root" . "component" "mlflow") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "rainforest.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "rainforest.selectorLabels" (dict "root" . "component" "ui") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5000
{{- end }}
