apiVersion: v1
kind: Service
metadata:
  name: {{ include "rainforest.fullname" . }}-ui
  labels:
    {{- include "rainforest.labels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  selector:
    {{- include "rainforest.selectorLabels" (dict "root" . "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
