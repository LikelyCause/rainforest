# A dev install: the chart's defaults, spelled out. Pick-mode sign-in does not authenticate; nothing here is for a team.
hostname: rainforest.localtest.me

auth:
  mode: pick

postgresql:
  enabled: true

mlflow:
  mode: in-chart

ingress:
  className: nginx

# Dev placeholders; real installs set secrets.existingSecret instead (see team-values.yaml).
secrets:
  values:
    postgresPassword: dev-postgres
    readonlyPassword: dev-readonly
