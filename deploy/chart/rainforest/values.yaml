# The defaults are a dev install: pick-mode sign-in (no authentication), Postgres and MLflow inside the release, no
# TLS; set hostname and the passwords under secrets.values (see ci/dev-values.yaml). Team installs: see
# ci/team-values.yaml.

# Required: the host name people open Rainforest at. Feeds the Ingress and RAINFOREST_ALLOWED_HOSTS.
hostname: ""
# The scheme people open it with, for the OIDC redirect URL and the install notes. Empty: https when
# ingress.tls.secretName is set, else http. Set https when TLS ends in front of the Ingress (a load balancer, say).
publicScheme: ""

# Registry credentials for the images below, as for any pod spec: [{name: regcred}].
imagePullSecrets: []
# Used to build the in-cluster FQDNs nginx proxies to (its resolver ignores search domains).
clusterDomain: cluster.local

nameOverride: ""
fullnameOverride: ""

auth:
  # pick: the sign-in page lists users to choose from and does NOT authenticate. oidc: single sign-on.
  mode: pick
  # Pick mode's RAINFOREST_USERS, "key[#id]:Name:role;..." with roles lead, member or viewer. Ignored under oidc.
  users: ""
  oidc:
    issuer: ""
    clientId: rainforest
    providerName: SSO
    scopes: openid profile email
    groupsClaim: groups
    leadGroup: rainforest-lead
    memberGroup: rainforest-member
    # Only when the pod can't reach the issuer URL itself.
    discoveryUrl: ""

postgresql:
  # true: a Postgres StatefulSet in this release. false: the server under external. The postgres image reads
  # POSTGRES_PASSWORD only when it initialises an empty volume, so changing the password later rolls the API and
  # MLflow (via checksum/secret) but not the database; rotating it also means ALTER ROLE in the database.
  enabled: true
  # The database and user the in-chart server is created with.
  database: rainforest
  user: rainforest
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  persistence:
    size: 20Gi
    # Empty: the cluster's default class.
    storageClass: ""
  resources: {}
  # Server settings passed as `postgres -c key=value`; the defaults are the Compose file's.
  tuning:
    shared_buffers: 512MB
    work_mem: 32MB
    maintenance_work_mem: 256MB
    max_wal_size: 4GB
  # The SQL console's SELECT-only role. Empty: <database>_ro.
  readonlyRole: ""
  external:
    host: ""
    port: 5432
    database: rainforest
    user: rainforest
    # false: the ops team created the console role (and, with in-chart MLflow, the MLflow database).
    managedRoles: true

mlflow:
  # in-chart: an MLflow server in this release (Deployment, Service, artifact volume), reached by people at the UI's
  #   /mlflow/ behind the Rainforest sign-in and by the API at its cluster address.
  # external: an existing server. The API logs to trackingUri (or externalUrl) and the UI links browsers to externalUrl,
  #   which is required; credentials come from the Secret keys mlflowTracking{Username,Password,Token}.
  # off: no experiment logging and no MLflow link.
  mode: in-chart
  # Where browsers open an external server.
  externalUrl: ""
  # Where the API logs to when that differs from externalUrl (often an internal address without the SSO in front).
  trackingUri: ""
  # Experiments are named <prefix>/<dataset id>-<dataset name> and found by dataset id and prefix, so releases sharing
  # one server need different prefixes. Empty: the release's namespace. Letters, digits and . _ / - only.
  experimentPrefix: ""

  # The settings below apply to in-chart mode only.
  # The server's backend database, on the same Postgres server as Rainforest's. Empty: <postgresql database>_mlflow. It
  # is created on start when the chart manages the server's roles (the in-chart Postgres, or external.managedRoles);
  # otherwise the operator creates it first.
  database: ""
  image:
    # The repo's mlflow/ image; set to your registry.
    repository: registry.example.com/rainforest/mlflow
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  persistence:
    # Artifacts (/mlartifacts); one ReadWriteOnce volume.
    size: 20Gi
    # Empty: the cluster's default class.
    storageClass: ""
  resources: {}
  nodeSelector: {}
  tolerations: []

api:
  image:
    # Set to your registry.
    repository: registry.example.com/rainforest/api
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  resources: {}
  nodeSelector: {}
  tolerations: []
  # Worker processes per API pod (WEB_CONCURRENCY) and log level.
  workers: 2
  logLevel: info
  jobs:
    workers: 2
    # Background jobs running at once across all workers; each gets cpu_count // slots threads.
    slots: 1
  # GPU training on the CUDA build of the API (which driver each build needs: deploy/README.md). Needs the NVIDIA device
  # plugin on the cluster. Enabled, the pod runs the tag <api.image.tag or appVersion>-<cuda>, limits nvidia.com/gpu to
  # count (added to api.resources.limits), and sets NVIDIA_DRIVER_CAPABILITIES=compute,utility.
  gpu:
    enabled: false
    # Required when enabled: the CUDA build, cuda13 or cu12.
    cuda: ""
    # A full tag that replaces the computed one, for a build outside the release's tags.
    imageTag: ""
    # GPUs the pod claims; at least 1.
    count: 1
    # Added to api.nodeSelector (this wins on a shared key) and after api.tolerations, only when enabled.
    nodeSelector: {}
    tolerations: []
  # Settings by their .env.example names; the defaults match api/app/config.py. A key the chart already sets from
  # another value (LOG_LEVEL, DATABASE_URL, ...) fails the render.
  tuning:
    PROFILE_SAMPLE_ROWS: 500000
    CORR_SAMPLE_ROWS: 100000
    CORR_MAX_LEVELS: 50
    COPY_BATCH_ROWS: 100000
    EXPORT_CHUNK_MB: 256
    EXPORT_FIT_MB: 512
    SAMPLE_MAX_CELLS: 60000000
    DB_POOL_MAX: 10
    SQL_TIMEOUT_MS: 15000
    SQL_MAX_ROWS: 2000
    SQL_POOL_MAX: 4

ui:
  replicas: 1
  image:
    repository: registry.example.com/rainforest/ui
    tag: ""
    pullPolicy: IfNotPresent
  resources: {}
  nodeSelector: {}
  tolerations: []

networkPolicy:
  # NetworkPolicies that admit only the api and ui pods to the in-chart MLflow, and only the api and mlflow pods to the
  # in-chart Postgres. They take effect only on a CNI that enforces NetworkPolicy.
  enabled: true

persistence:
  # Annotates the data and MLflow claims so helm uninstall and an Argo CD delete or prune leave them in place; delete
  # them by hand to reclaim the space. The in-chart Postgres volume is kept either way (a StatefulSet's claims are).
  keep: true
  data:
    # Datasets, exports and models; one ReadWriteOnce volume owned by the API pod.
    size: 50Gi
    storageClass: ""

secrets:
  # Name of a Secret you manage (keys below). Real installs use this: the Secret is created by your secret tooling,
  # so no credential sits in a values file. Empty: the chart creates one from `values`, which is for dev and CI only.
  # Keys: sessionSecret (optional), oidcClientSecret (oidc), readonlyPassword, postgresPassword,
  # mlflowTrackingUsername / mlflowTrackingPassword / mlflowTrackingToken (optional, external MLflow).
  existingSecret: ""
  # Used only when existingSecret is empty. postgresPassword and readonlyPassword are required (nothing is generated,
  # so every render is identical); oidcClientSecret is required under auth.mode oidc. The Postgres password reaches the
  # API and MLflow as PGPASSWORD, not inside a URL, so it may contain any character. An empty sessionSecret makes the
  # API generate one into the data volume.
  values:
    sessionSecret: ""
    oidcClientSecret: ""
    readonlyPassword: ""
    postgresPassword: ""
    mlflowTrackingUsername: ""
    mlflowTrackingPassword: ""
    mlflowTrackingToken: ""

ingress:
  # Set to your controller's class. "nginx" also sets the ingress-nginx annotations large uploads need (no body limit,
  # no request buffering, 600 s read and send timeouts); for other controllers set the equivalents under annotations.
  className: ""
  # An annotation of the same name as one the chart sets wins.
  annotations: {}
  #  cert-manager.io/cluster-issuer: letsencrypt
  tls:
    # Name of the TLS Secret; empty: plain HTTP.
    secretName: ""
