name: rainforest

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rainforest}
      POSTGRES_USER: ${POSTGRES_USER:-rainforest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rainforest}
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c max_wal_size=4GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost so you can point psql / DBeaver at it for ad-hoc queries.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
      args:
        EXTRA_PIP: ${API_EXTRA_PIP:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rainforest}:${POSTGRES_PASSWORD:-rainforest}@db:5432/${POSTGRES_DB:-rainforest}
      READONLY_PASSWORD: ${READONLY_PASSWORD:-rainforest_ro}
      DATA_DIR: /data
      WEB_CONCURRENCY: ${API_WORKERS:-2}
      JOB_WORKERS: ${JOB_WORKERS:-2}
      JOB_SLOTS: ${JOB_SLOTS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Without a password the API refuses every request but /health.
      RAINFOREST_ADMIN_USER: ${RAINFOREST_ADMIN_USER:-admin}
      RAINFOREST_ADMIN_PASSWORD: ${RAINFOREST_ADMIN_PASSWORD:-}
      RAINFOREST_SESSION_SECRET: ${RAINFOREST_SESSION_SECRET:-}
      RAINFOREST_ALLOWED_HOSTS: ${RAINFOREST_ALLOWED_HOSTS:-*}
      # Tuning (README › Configuration); the defaults match api/app/config.py.
      PROFILE_SAMPLE_ROWS: ${PROFILE_SAMPLE_ROWS:-500000}
      CORR_SAMPLE_ROWS: ${CORR_SAMPLE_ROWS:-100000}
      CORR_MAX_LEVELS: ${CORR_MAX_LEVELS:-50}
      COPY_BATCH_ROWS: ${COPY_BATCH_ROWS:-100000}
      EXPORT_CHUNK_MB: ${EXPORT_CHUNK_MB:-256}
      EXPORT_FIT_MB: ${EXPORT_FIT_MB:-512}
      SAMPLE_MAX_CELLS: ${SAMPLE_MAX_CELLS:-60000000}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      SQL_TIMEOUT_MS: ${SQL_TIMEOUT_MS:-15000}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-2000}
      SQL_POOL_MAX: ${SQL_POOL_MAX:-4}
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ui:
    build: ./ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # All interfaces, so the UI is reachable over the LAN; sign-in protects it.
      - "${UI_PORT:-8080}:80"

volumes:
  pgdata:
  appdata:
