name: rainforest

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rainforest}
      POSTGRES_USER: ${POSTGRES_USER:-rainforest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rainforest}
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c max_wal_size=4GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost so you can point psql / DBeaver at it for ad-hoc queries.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
      args:
        EXTRA_PIP: ${API_EXTRA_PIP:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rainforest}:${POSTGRES_PASSWORD:-rainforest}@db:5432/${POSTGRES_DB:-rainforest}
      READONLY_PASSWORD: ${READONLY_PASSWORD:-rainforest_ro}
      DATA_DIR: /data
      DEFAULT_TARGETS: ${DEFAULT_TARGETS:-column_a,column_b}
      WEB_CONCURRENCY: ${API_WORKERS:-2}
      JOB_WORKERS: ${JOB_WORKERS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ui:
    build: ./ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${UI_PORT:-8080}:80"

volumes:
  pgdata:
  appdata:
