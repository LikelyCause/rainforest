name: rainforest

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rainforest}
      POSTGRES_USER: ${POSTGRES_USER:-rainforest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rainforest}
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c max_wal_size=4GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost so you can point psql / DBeaver at it for ad-hoc queries.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
      args:
        EXTRA_PIP: ${API_EXTRA_PIP:-}
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rainforest}:${POSTGRES_PASSWORD:-rainforest}@db:5432/${POSTGRES_DB:-rainforest}
      READONLY_ROLE: ${READONLY_ROLE:-rainforest_ro}
      READONLY_PASSWORD: ${READONLY_PASSWORD:-rainforest_ro}
      DATA_DIR: /data
      WEB_CONCURRENCY: ${API_WORKERS:-2}
      JOB_WORKERS: ${JOB_WORKERS:-2}
      JOB_SLOTS: ${JOB_SLOTS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Sign-in (docs/deployment.md › Sign-in): "pick" doesn't authenticate; team deployments use "oidc".
      RAINFOREST_AUTH_MODE: ${RAINFOREST_AUTH_MODE:-pick}
      RAINFOREST_USERS: ${RAINFOREST_USERS:-}
      RAINFOREST_OIDC_ISSUER: ${RAINFOREST_OIDC_ISSUER:-}
      RAINFOREST_OIDC_DISCOVERY_URL: ${RAINFOREST_OIDC_DISCOVERY_URL:-}
      RAINFOREST_OIDC_CLIENT_ID: ${RAINFOREST_OIDC_CLIENT_ID:-}
      RAINFOREST_OIDC_CLIENT_SECRET: ${RAINFOREST_OIDC_CLIENT_SECRET:-}
      RAINFOREST_OIDC_REDIRECT_URL: ${RAINFOREST_OIDC_REDIRECT_URL:-}
      RAINFOREST_OIDC_SCOPES: ${RAINFOREST_OIDC_SCOPES:-openid profile email}
      RAINFOREST_OIDC_GROUPS_CLAIM: ${RAINFOREST_OIDC_GROUPS_CLAIM:-groups}
      RAINFOREST_OIDC_PROVIDER_NAME: ${RAINFOREST_OIDC_PROVIDER_NAME:-SSO}
      RAINFOREST_LEAD_GROUP: ${RAINFOREST_LEAD_GROUP:-rainforest-lead}
      RAINFOREST_MEMBER_GROUP: ${RAINFOREST_MEMBER_GROUP:-rainforest-member}
      RAINFOREST_SESSION_SECRET: ${RAINFOREST_SESSION_SECRET:-}
      RAINFOREST_ALLOWED_HOSTS: ${RAINFOREST_ALLOWED_HOSTS:-*}
      # false: an operator creates the SQL console's role (docs/sql.md); the API only grants to it.
      RAINFOREST_MANAGED_ROLES: ${RAINFOREST_MANAGED_ROLES:-true}
      # Empty turns MLflow logging off. The server serves everything, its REST API too, under /mlflow.
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI-http://mlflow:5000/mlflow}
      MLFLOW_BROWSE_URL: ${MLFLOW_BROWSE_URL:-}
      MLFLOW_EXPERIMENT_PREFIX: ${MLFLOW_EXPERIMENT_PREFIX:-rainforest}
      # Tuning (docs/configuration.md); the defaults match api/app/config.py.
      PROFILE_SAMPLE_ROWS: ${PROFILE_SAMPLE_ROWS:-500000}
      CORR_SAMPLE_ROWS: ${CORR_SAMPLE_ROWS:-100000}
      CORR_MAX_LEVELS: ${CORR_MAX_LEVELS:-50}
      COPY_BATCH_ROWS: ${COPY_BATCH_ROWS:-100000}
      EXPORT_CHUNK_MB: ${EXPORT_CHUNK_MB:-256}
      EXPORT_FIT_MB: ${EXPORT_FIT_MB:-512}
      SAMPLE_MAX_CELLS: ${SAMPLE_MAX_CELLS:-60000000}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      SQL_TIMEOUT_MS: ${SQL_TIMEOUT_MS:-15000}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-2000}
      SQL_POOL_MAX: ${SQL_POOL_MAX:-4}
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mlflow:
    build: ./mlflow
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Its own database in the db service, created on start if missing.
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-rainforest}:${POSTGRES_PASSWORD:-rainforest}@db:5432/mlflow
      # false: the database must already exist, and the user needs no CREATEDB.
      MLFLOW_MANAGED_DATABASE: ${MLFLOW_MANAGED_DATABASE:-true}
    # No host port: the API logs to it directly, browsers reach it through the UI's nginx at /mlflow/.
    command: >
      --host 0.0.0.0 --port 5000 --workers 2
      --serve-artifacts --artifacts-destination /mlartifacts
      --static-prefix /mlflow
      --allowed-hosts mlflow,mlflow:5000
    volumes:
      - mlartifacts:/mlartifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/mlflow/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ui:
    build: ./ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # All interfaces, so the UI is reachable over the LAN; sign-in protects it.
      - "${UI_PORT:-8080}:80"

  # Reference identity provider, in the keycloak profile (COMPOSE_PROFILES=keycloak or make up-keycloak).
  # start-dev: plain HTTP, dev-only settings; not for production.
  keycloak-db:
    image: postgres:16-alpine
    profiles: [keycloak]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-rainforest}
      PGPASSWORD: ${POSTGRES_PASSWORD:-rainforest}
      PGDATABASE: ${POSTGRES_DB:-rainforest}
    # Keycloak keeps its own database in the same Postgres; created here because init scripts only run on a new volume.
    command: ["sh", "-c", "psql -tAc \"SELECT 1 FROM pg_database WHERE datname = 'keycloak'\" | grep -q 1 || psql -c 'CREATE DATABASE keycloak'"]

  keycloak:
    build: ./keycloak
    profiles: [keycloak]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-rainforest}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-rainforest}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Tokens carry this URL as their issuer, so browsers and the API must both use it. The API container reaches
      # Keycloak as http://keycloak:8080, and the dynamic backchannel answers it with token / JWKS URLs on that name.
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Fills the redirect and post-logout URIs in the realm import (first start only).
      RAINFOREST_URL: ${RAINFOREST_URL:-http://localhost:8080}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
  appdata:
  mlartifacts:
